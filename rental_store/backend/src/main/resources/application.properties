spring.config.import=optional:file:.env[.properties]

spring.application.name=keja
spring.jackson.serialization.write-dates-as-timestamps=false
spring.data.web.pageable.max-page-size=100
server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.access-key=${R2_ACCESS_KEY:}
app.storage.r2.secret-key=${R2_SECRET_KEY:}
app.storage.r2.bucket=${R2_BUCKET:pata-keja-dev}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.storage.r2.region=${R2_REGION:auto}

# Core Database Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties (Optional but recommended)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

cloud_flare_api=${CLOUDFLARE_API}
