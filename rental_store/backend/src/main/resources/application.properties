spring.config.import=optional:file:.env[.properties]

spring.application.name=keja
spring.data.web.pageable.max-page-size=100
server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.storage.r2.endpoint=${R2_ENDPOINT:http://localhost:9000}
app.storage.r2.access-key=${R2_ACCESS_KEY:local-access-key-unsafe}
app.storage.r2.secret-key=${R2_SECRET_KEY:local-secret-key-unsafe}
app.storage.r2.bucket=${R2_BUCKET:pata-keja-dev}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.storage.r2.region=${R2_REGION:auto}
app.security.jwt-secret=${JWT_SECRET:local-development-jwt-secret-change-me-please}
app.security.jwt-ttl-hours=${JWT_TTL_HOURS:24}

# Core Database Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/hostelix?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${LOCAL_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties (Optional but recommended)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

cloud_flare_api=${CLOUDFLARE_API}
